<template>
  <div class="portfolio-shell">
    <c-portfolio-header brand-label={displayPageTitle}></c-portfolio-header>
    <!-- O template LWR já fornece o landmark main e o link "Skip to Main"; um div evita main aninhado. -->
    <!-- O id fora de lwc:if faz o compilador LWC aplicar aos href="#..." o mesmo sufixo dos ids das seções. -->
    <div id="portfolio-content" class="main-content">
      <c-portfolio-hero
        heading={displayPageTitle}
        summary={displayIntroduction}
      ></c-portfolio-hero>
      <template lwc:if={hasConfigurationError}>
        <p class="configuration-error" role="alert">
          {configurationErrorMessage}
        </p>
      </template>
      <nav class="section-nav" aria-label="Navegação das seções">
        <template lwc:if={hasAbout}>
          <a href="#about">Sobre</a>
        </template>
        <template lwc:if={hasExperience}>
          <a href="#experience">Experiência</a>
        </template>
        <template lwc:if={hasSkills}>
          <a href="#skills">Habilidades</a>
        </template>
        <template lwc:if={hasProjects}>
          <a href="#projects">Projetos</a>
        </template>
        <template lwc:if={hasContact}>
          <a href="#contact">Contato</a>
        </template>
      </nav>
      <template lwc:if={hasAbout}>
        <section id="about" class="portfolio-section">
          <c-portfolio-about description={displayAbout}></c-portfolio-about>
        </section>
      </template>
      <template lwc:if={hasExperience}>
        <section id="experience" class="portfolio-section">
          <c-portfolio-experience
            items={experienceItems}
          ></c-portfolio-experience>
        </section>
      </template>
      <template lwc:if={hasSkills}>
        <section id="skills" class="portfolio-section">
          <c-portfolio-skills groups={skillGroups}></c-portfolio-skills>
        </section>
      </template>
      <template lwc:if={hasProjects}>
        <section id="projects" class="portfolio-section">
          <c-portfolio-projects projects={projects}></c-portfolio-projects>
        </section>
      </template>
      <template lwc:if={hasContact}>
        <section id="contact" class="portfolio-section">
          <c-portfolio-contact
            email={contactEmail}
            linkedin-url={linkedinUrl}
            github-url={githubUrl}
          ></c-portfolio-contact>
        </section>
      </template>
    </div>
    <c-portfolio-footer></c-portfolio-footer>
  </div>
</template>
